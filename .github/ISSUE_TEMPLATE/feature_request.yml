name: Feature request
description: Suggest an improvement to the public site or documentation shell
title: '[Feature]: '
labels: ['enhancement']
body:
  - type: markdown
    attributes:
      value: |
        For new or changed **standards content**, propose changes in [Engineering-Standards](https://github.com/Litenova-Solutions/Engineering-Standards).

  - type: textarea
    id: problem
    attributes:
      label: Problem or opportunity
      description: What problem does this solve, or what would it improve?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe the change you would like to see.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Marketing site
        - Standards site (theme, layout, navigation)
        - Staging / build tooling
        - Documentation
        - Other
    validations:
      required: true
